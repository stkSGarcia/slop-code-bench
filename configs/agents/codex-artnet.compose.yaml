# Build CLIs with their own Dockerfiles; the agent image includes their files.
# Only ArtNet conditions start Neo4j for each benchmark problem.
# Random loopback ports and project-scoped resources isolate concurrent problems.
services:
  artifactnet-cli:
    profiles: [build]
    build:
      context: ../../../artnet
      target: runtime-base
    image: slop-artnet:latest

  matrixspec-cli:
    extends:
      file: codex-matrixspec.compose.yaml
      service: matrixspec-cli

  neo4j:
    image: neo4j:5-community
    ports:
      - "127.0.0.1::7474"
      - "127.0.0.1::7687"
    environment:
      NEO4J_AUTH: neo4j/12345678
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u "$${NEO4J_AUTH%%/*}"
          -p "$${NEO4J_AUTH#*/}" 'RETURN 1' >/dev/null 2>&1
      interval: 10s
      timeout: 60s
      retries: 12
      start_period: 120s

volumes:
  neo4j-data:
  neo4j-logs:
